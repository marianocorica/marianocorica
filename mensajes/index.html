<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Predicaciones — Mariano A. Corica</title>

    <meta
        name="description"
        content="Predicaciones de Mariano A. Corica sobre el Evangelio, la fe y la vida cristiana."
    >

    <meta
        name="author"
        content="Mariano A. Corica"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://marianocorica.com.ar/mensajes/"
    >

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>
        .messages-grid {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 32px 110px;
        }

        .messages-grid .message-card {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            align-items: start;
            padding: 65px 0;
            border-bottom: 1px solid var(--line);
        }

        .messages-grid .message-video {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .messages-grid .message-info {
            max-width: 700px;
        }

        .messages-grid .message-info h2 {
            font-size: clamp(2.3rem, 4vw, 4rem);
        }

        @media (max-width: 700px) {

            .messages-grid {
                padding: 0 22px 80px;
            }

            .messages-grid .message-card {
                gap: 24px;
                padding: 50px 0;
            }

        }
    </style>

</head>


<body>


<header class="site-header">

    <a
        href="../index.html"
        class="site-name"
    >
        MARIANO A. CORICA
    </a>


    <nav class="main-nav">

        <a href="../index.html#libros">
            Libros
        </a>

        <a href="index.html">
            Predicaciones
        </a>

        <a href="../entrevistas/index.html">
            Entrevistas
        </a>

        <a href="../index.html#sobre-mi">
            Sobre mí
        </a>

    </nav>

</header>


<main>


    <section class="hero">

        <p class="eyebrow">
            Predicación y enseñanza
        </p>

    </section>


    <section class="messages-grid">


        <article class="message-card">

            <div class="message-video">

                <iframe
                    src="https://www.youtube.com/embed/eSDHF8tHdCg"
                    title="Crecer en Comunidad — Mariano A. Corica"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="message-info">
                <a
                    href="https://www.youtube.com/watch?v=eSDHF8tHdCg"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-link"
                >
                    Ver en YouTube →
                </a>

            </div>

        </article>


        <article class="message-card">

            <div class="message-video">

                <iframe
                    src="https://www.youtube.com/embed/r_E1hMdgxqo?start=536"
                    title="Poner el cuerpo — Mariano A. Corica"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="message-info">

                <a
                    href="https://www.youtube.com/live/r_E1hMdgxqo?si=UUroDDZa2r_htk0I&t=536"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-link"
                >
                    Ver en YouTube →
                </a>

            </div>

        </article>


    </section>


</main>


<footer class="site-footer">

    <div>

        <strong>
            MARIANO A. CORICA
        </strong>

        <p>
            Teólogo y escritor
        </p>

    </div>


    <div>

        <p>
            © 2026 Mariano A. Corica
        </p>

    </div>

</footer>


</body>

</html>
